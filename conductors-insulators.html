<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Challenge: Technical English</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; background: #05080a; color: #00f3ff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-terminal { width: 550px; background: #0a1118; border: 2px solid #00f3ff; border-radius: 5px; padding: 25px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 3px; margin: 0 0 10px 0; border-bottom: 1px solid #00f3ff; padding-bottom: 10px; }
        #hud { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 20px; color: #888; }
        .stat { color: #00f3ff; font-weight: bold; }
        #display-screen { background: #020508; border: 1px solid #1a2a3a; padding: 20px; min-height: 130px; margin-bottom: 20px; border-radius: 4px; font-size: 16px; line-height: 1.5; color: #00f3ff; overflow-y: auto; }
        #input-preview { font-size: 13px; color: #7f8c8d; margin-bottom: 20px; font-style: italic; min-height: 20px; border-left: 3px solid #34495e; padding-left: 10px; }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 12px; font-family: 'Courier New', monospace; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        button:hover:not(:disabled) { background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 10px #00f3ff; }
        button:disabled { border-color: #34495e; color: #34495e; cursor: not-allowed; }
        .btn-main { grid-column: span 2; background: #00f3ff; color: #0a1118; font-size: 16px; }
        .btn-reset { grid-column: span 2; border: 1px solid #e74c3c; color: #e74c3c; margin-top: 10px; font-size: 11px; }
        .listening { animation: pulse 1.5s infinite; background: rgba(0, 243, 255, 0.1) !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px #00f3ff; } 50% { box-shadow: 0 0 20px #00f3ff; } 100% { box-shadow: 0 0 5px #00f3ff; } }
    </style>
</head>
<body>

<div id="game-terminal">
    <h1>Technical Challenge</h1>
    <div id="hud">
        <span>Level: <span id="lvl" class="stat">0</span></span>
        <span>Status: <span id="sts" class="stat">OFFLINE</span></span>
    </div>

    <div id="display-screen">SYSTEM STANDBY. Press ACTIVATE MISSION to begin the engineering test.</div>
    <div id="input-preview">Waiting for voice input...</div>

    <div class="grid-buttons">
        <button id="startBtn" class="btn-main" onclick="startMission()">[ ACTIVATE MISSION ]</button>
        <button id="micBtn" onclick="toggleMic()" disabled>1. Speak</button>
        <button id="sendBtn" onclick="sendData()" disabled>2. Send Answer</button>
        <button class="btn-reset" onclick="location.reload()">ABORT / RESET</button>
    </div>
</div>

<script>
    // URL AGGIORNATO CON IL TUO NUOVO LINK
    const ENGINE_URL = "https://script.google.com/macros/s/AKfycbz-1XNa4TVQqfCbtbQAMM6xH7oRq6Zk_sb3DB0-vdNJ8nyN_ClYz9P4r691LNVF2Ko-/exec";
    
    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-GB';
    recognition.continuous = true;
    let isListening = false;
    let britishVoice = null;

    function loadVoices() {
        let voices = window.speechSynthesis.getVoices();
        // Cerchiamo una voce britannica
        britishVoice = voices.find(v => v.lang === 'en-GB' && (v.name.includes('UK') || v.name.includes('Female') || v.name.includes('Google')));
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function startMission() {
        document.getElementById('sts').innerText = "CONNECTING...";
        processEngine("reset");
    }

    function toggleMic() {
        if (!isListening) {
            recognition.start();
            isListening = true;
            document.getElementById('micBtn').innerText = "STOP RECORDING";
            document.getElementById('micBtn').classList.add('listening');
        } else {
            recognition.stop();
            isListening = false;
            document.getElementById('micBtn').innerText = "1. SPEAK";
            document.getElementById('micBtn').classList.remove('listening');
        }
    }

    recognition.onresult = (event) => {
        let transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById('input-preview').innerText = transcript;
    };

    function sendData() {
        let text = document.getElementById('input-preview').innerText;
        if (text === "Waiting for voice input..." || text === "") return;
        document.getElementById('sts').innerText = "ANALYZING...";
        processEngine(text);
    }

    function processEngine(text) {
        fetch(ENGINE_URL, { method: 'POST', body: JSON.stringify({ testo: text }) })
        .then(res => res.json())
        .then(data => {
            document.getElementById('display-screen').innerText = data.text;
            document.getElementById('lvl').innerText = data.level;
            document.getElementById('sts').innerText = data.status.toUpperCase();
            speak(data.text);

            if (text === "reset") {
                document.getElementById('startBtn').disabled = true;
                document.getElementById('micBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            }
        })
        .catch(err => {
            document.getElementById('display-screen').innerText = "ERROR: Connection failed. Check Script permissions.";
            document.getElementById('sts').innerText = "ERROR";
        });
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-GB';
        if (britishVoice) msg.voice = britishVoice;
        msg.pitch = 1;
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
