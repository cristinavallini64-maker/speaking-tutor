<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechQuest 2026_</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00bcd4;
            --bg-black: #0a0e17;
            --terminal-bg: rgba(16, 24, 39, 0.95);
        }

        body { 
            background: var(--bg-black); 
            color: var(--neon-green); 
            font-family: 'Roboto Mono', monospace; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden;
        }

        .terminal { 
            background: var(--terminal-bg); 
            width: 95%; 
            max-width: 500px; 
            padding: 30px; 
            border: 2px solid var(--neon-green); 
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.2); 
            border-radius: 12px; 
            position: relative;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; 
            text-align: center; 
            font-size: 1.6rem; 
            text-shadow: 0 0 10px var(--neon-green); 
            margin-top: 0; 
            letter-spacing: 2px;
        }

        #history { 
            font-size: 0.85rem; 
            color: var(--neon-blue); 
            margin-bottom: 12px; 
            height: 1.3rem; 
            font-style: italic; 
            border-bottom: 1px solid #1a202c;
            overflow: hidden;
            white-space: nowrap;
        }

        #screen { 
            background: #000; 
            padding: 25px; 
            border-radius: 8px; 
            min-height: 180px; 
            margin-bottom: 20px; 
            border: 1px solid #333; 
            font-size: 1.1rem; 
            line-height: 1.6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            color: #e0e6ed;
            transition: all 0.3s;
        }

        .input-group { position: relative; margin-bottom: 15px; }

        input { 
            width: 100%; 
            padding: 16px; 
            background: #000; 
            border: 1.5px solid var(--neon-green); 
            color: var(--neon-blue); 
            border-radius: 6px; 
            font-size: 1.1rem; 
            box-sizing: border-box; 
            outline: none; 
            font-family: 'Roboto Mono', monospace;
        }

        input:focus { box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }

        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        button { 
            padding: 16px; 
            border: none; 
            border-radius: 6px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .btn-send { background: var(--neon-green); color: #0a0e17; }
        .btn-mic { background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); }
        
        button:hover { transform: translateY(-2px); filter: brightness(1.2); }
        button:active { transform: translateY(0); }

        .btn-reset { 
            background: none; 
            color: #444; 
            border: none; 
            width: 100%; 
            margin-top: 25px; 
            cursor: pointer; 
            font-size: 0.75rem; 
            text-decoration: underline; 
            font-family: inherit;
        }
        .btn-reset:hover { color: #ff4444; }

        /* Effetti per errori e successi */
        .shake { animation: shake 0.4s; color: #ff4444 !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
    </style>
</head>
<body>

<div class="terminal">
    <h1>> TECH_QUEST_</h1>
    <div id="history">BOOTING SYSTEM...</div>
    <div id="screen">CONNECTION ESTABLISHED.<br>Type "reset" and press Send to start the simulation.</div>
    
    <div class="input-group">
        <input type="text" id="user-input" placeholder="Enter command or answer..." autofocus>
    </div>
    
    <div class="grid">
        <button class="btn-send" onclick="send()">[SEND]</button>
        <button class="btn-mic" id="mic-btn">[VOICE]</button>
    </div>

    <button class="btn-reset" onclick="if(confirm('WARNING: This will wipe current progress. Proceed?')) send('reset')">FORCE SYSTEM RESET</button>
</div>

<script>
    // IL TUO LINK UFFICIALE INTEGRATO
    const url = "https://script.google.com/macros/s/AKfycbxRqDj7pNFwjGUGqVqMbsjjE2Ky9ACEm83oRJGo38m0sTw6Ju-UMCX5opa1THTqy5eC/exec";
    
    const input = document.getElementById('user-input');
    const screen = document.getElementById('screen');
    const history = document.getElementById('history');

    async function send(val) {
        const text = val || input.value.trim();
        if(!text) return;

        // Feedback immediato
        history.innerText = ">> LAST_INPUT: " + text.toUpperCase();
        screen.innerText = "ACCESSING DATABASE...";
        screen.classList.remove('shake');
        input.value = "";

        try {
            const response = await fetch(url + "?testo=" + encodeURIComponent(text));
            const data = await response.json();
            
            // Render del testo con a capo
            screen.innerHTML = data.text.replace(/\n/g, "<br>");
            
            // Colore e animazione in caso di errore
            if(data.text.includes("❌")) {
                screen.classList.add('shake');
            } else {
                screen.style.color = "#e0e6ed"; // Colore normale
            }
        } catch(e) {
            screen.innerText = "CRITICAL ERROR: Connection to server lost.";
            screen.style.color = "#ff4444";
        }
    }

    // Configurazione Vocale
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        send(transcript);
    };

    document.getElementById('mic-btn').onclick = () => {
        recognition.start();
        screen.innerText = "LISTENING... (Speak now)";
    };

    // Invio con tasto Enter
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>
</body>
</html>
