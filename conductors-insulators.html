<script>
  // ... (tutto il resto uguale)

  function send() {
    let finalTxt = (transcript || document.getElementById('pre').innerText).trim();
    if(!finalTxt || finalTxt === "...") return;
    
    const disp = document.getElementById('display');
    disp.innerText = "Checking...";
    rec.stop(); 
    document.getElementById('mic').classList.remove('rec');

    // Chiamata al server
    fetch(`${URL}?testo=${encodeURIComponent(finalTxt)}&uid=${uid}`)
      .then(r => r.json())
      .then(d => {
        disp.innerText = d.text; speak(d.text);
        transcript = ""; 
        document.getElementById('pre').innerText = "...";
      }).catch(e => {
        disp.innerText = "Error. Try sending again.";
      });
  }
</script>
