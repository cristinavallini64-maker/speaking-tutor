<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Tutor – Conductors & Insulators</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap');
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --accent: #58a6ff; --green: #3fb950; --orange: #f0a742; --red: #f78166; --text: #e6edf3; --muted: #8b949e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  header { width: 100%; max-width: 740px; display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .badge { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); border: 1px solid var(--accent); padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
  h1 { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; }
  .level-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 740px; margin-bottom: 20px; }
  .level-pip { height: 50px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .level-pip.active { border-color: var(--accent); color: var(--accent); }
  .pip-num { font-family: 'Space Mono', monospace; font-weight: 700; }
  .pip-name { font-size: 9px; text-transform: uppercase; }
  #chat-box { width: 100%; max-width: 740px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; }
  .tutor { background: #1c2128; align-self: flex-start; border-left: 3px solid var(--accent); }
  .student { background: #0d2137; align-self: flex-end; border-right: 3px solid var(--accent); }
  #transcript-box { width: 100%; max-width: 740px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; min-height: 52px; margin-bottom: 12px; color: var(--muted); font-style: italic; }
  .controls { width: 100%; max-width: 740px; display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
  #btn-talk { background: var(--red); color: white; flex: 2; }
  #btn-send { background: var(--accent); color: #0d1117; }
</style>
</head>
<body>

<header>
  <span class="badge">Unit 1</span>
  <h1>Conductors & Insulators</h1>
</header>

<div class="level-track">
  <div class="level-pip active" id="pip-1"><span class="pip-num">1</span><span class="pip-name">Keywords</span></div>
  <div class="level-pip" id="pip-2"><span class="pip-num">2</span><span class="pip-name">Sentence</span></div>
  <div class="level-pip" id="pip-3"><span class="pip-num">3</span><span class="pip-name">Double</span></div>
  <div class="level-pip" id="pip-4"><span class="pip-num">4</span><span class="pip-name">Paragraph</span></div>
</div>

<div id="chat-box"></div>
<div id="transcript-box">Premi 'TALK' e rispondi in inglese...</div>

<div class="controls">
  <button class="btn" id="btn-talk">🎤 TALK</button>
  <button class="btn" id="btn-send" disabled>SEND ➜</button>
</div>

<script>
const PROXY_URL = 'https://script.google.com/macros/s/AKfycby_f17Z1GMj1K-K62PThg1ZT4RGaNO0mwO2S1DJOu8wJvULI6NcPEm1YRviXYykUvs7/exec';

const QUESTIONS = {
  1: ["What flows through a conductor?", "Name a material that is a good conductor.", "Name a good insulator."],
  2: ["What is a conductor?", "What is an insulator?"],
  3: ["Why are metals good conductors but rubber is not?"],
  4: ["Explain the difference between conductors and insulators."]
};

let currentLevel = 1;
let currentQIndex = 0;
let recognition;
let transcript = "";

// 1. SINTESI VOCALE (Far parlare il Tutor)
function speak(text) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

// 2. RICONOSCIMENTO VOCALE (Ascoltare)
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    transcript = e.results[0][0].transcript;
    document.getElementById('transcript-box').innerText = transcript;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('btn-talk').style.background = 'var(--red)';
  };
}

document.getElementById('btn-talk').onclick = () => {
  recognition.start();
  document.getElementById('btn-talk').style.background = 'var(--green)';
  document.getElementById('transcript-box').innerText = "Listening...";
};

// 3. INVIO E RISPOSTA
async function sendMessage() {
  if (!transcript) return;
  addMessage('student', transcript);
  const currentQ = QUESTIONS[currentLevel][currentQIndex];
  
  document.getElementById('btn-send').disabled = true;
  document.getElementById('transcript-box').innerText = "Thinking...";

  try {
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      body: JSON.stringify({ prompt: `Level ${currentLevel}. Question: ${currentQ}. Answer: ${transcript}` })
    });
    const reply = await response.text();
    addMessage('tutor', reply);
    speak(reply);

    currentQIndex++;
    if (currentQIndex < QUESTIONS[currentLevel].length) {
      setTimeout(askQuestion, 2000);
    } else {
      currentLevel++; currentQIndex = 0;
      addMessage('tutor', "Great! Level Complete. Moving to next level...");
      setTimeout(askQuestion, 3000);
    }
  } catch (e) {
    addMessage('tutor', "Connection error.");
  }
}

function askQuestion() {
  const q = QUESTIONS[currentLevel][currentQIndex];
  addMessage('tutor', q);
  speak(q);
  transcript = "";
  document.getElementById('transcript-box').innerText = "Premi 'TALK' per rispondere...";
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerText = text;
  document.getElementById('chat-box').appendChild(div);
  document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
}

document.getElementById('btn-send').onclick = sendMessage;
window.onload = askQuestion;
</script>
</body>
</html>
