<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Mission - British Tutor</title>
    <style>
        :root { --neon-blue: #00f3ff; --neon-pink: #ff00ff; --neon-green: #39ff14; --bg-dark: #0a0b10; }
        * { user-select: none; -webkit-user-select: none; outline: none; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        #terminal {
            width: 90%; max-width: 650px; height: 300px;
            border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            background: black; padding: 20px; margin-bottom: 20px;
            border-radius: 12px; overflow-y: auto; font-size: 1.2rem;
        }
        .tutor-text { color: var(--neon-blue); font-weight: bold; margin-bottom: 10px; }
        .user-text { color: #ff4d4d; font-style: italic; }
        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 90%; max-width: 650px; }
        .lvl-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            padding: 15px; font-size: 1rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; border: 2px solid var(--neon-blue); background: transparent;
            color: var(--neon-blue); transition: all 0.3s; border-radius: 8px;
        }
        button:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
        .btn-lvl { border-color: var(--neon-green); color: var(--neon-green); padding: 10px 20px; }
        #btn-rec.active-rec { animation: pulse 1.5s infinite; border-color: red; color: red; }
        #btn-report { grid-column: span 2; border-color: var(--neon-pink); color: var(--neon-pink); display: none; }
        #btn-send { grid-column: span 2; border-color: var(--neon-blue); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body onkeydown="return false;">

    <h1 style="color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); margin: 10px;">SPEAKING MISSION</h1>

    <div class="lvl-selector" id="lvl-container">
        <button class="btn-lvl" onclick="selectLevel(1)">Level 1</button>
        <button class="btn-lvl" onclick="selectLevel(2)">Level 2</button>
        <button class="btn-lvl" onclick="selectLevel(3)">Level 3</button>
    </div>

    <div id="terminal">
        <div class="tutor-text">Select a level to begin...</div>
    </div>

    <div class="controls">
        <button id="btn-rec" onclick="toggleRec()">🎤 Rec</button>
        <button id="btn-del" onclick="deleteWord()">✖ Delete Word</button>
        <button id="btn-send" onclick="sendData()">📡 Send Data</button>
        <button id="btn-report" onclick="getReport()">📊 Get Final Report</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWnT_nyuCGb00_GADg_vAOOz-iCx6N_SPr-1-7zuY8u0TVupUvhh68Lx83mCipVsiX/exec";
        let recognition;
        let isRecording = false;
        let transcriptBuffer = "";

        // Caricamento voce British
        let britishVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            britishVoice = voices.find(v => v.lang === 'en-GB' || v.name.includes('UK'));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            if (britishVoice) msg.voice = britishVoice;
            msg.lang = 'en-GB';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-GB';
            recognition.onresult = (event) => {
                transcriptBuffer += " " + event.results[event.results.length - 1][0].transcript;
                updateTerminal();
            };
        }

        function updateTerminal(tutorMsg) {
            const term = document.getElementById('terminal');
            const currentTutor = tutorMsg || term.querySelector('.tutor-text').innerText;
            term.innerHTML = `<div class="tutor-text">${currentTutor}</div><div class="user-text">> ${transcriptBuffer}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        function selectLevel(lvl) {
            transcriptBuffer = "";
            updateTerminal("Loading Level " + lvl + "...");
            fetch(`${SCRIPT_URL}?testo=startLvl${lvl}`)
                .then(res => res.json())
                .then(data => {
                    updateTerminal(data.text);
                    speak(data.text);
                    // Reset visibilità report al cambio livello
                    document.getElementById('btn-report').style.display = 'none';
                });
        }

        function toggleRec() {
            const btn = document.getElementById('btn-rec');
            if (!isRecording) {
                recognition.start();
                btn.classList.add('active-rec');
                isRecording = true;
            } else {
                recognition.stop();
                btn.classList.remove('active-rec');
                isRecording = false;
            }
        }

        function deleteWord() {
            let words = transcriptBuffer.trim().split(" ");
            words.pop();
            transcriptBuffer = words.join(" ");
            updateTerminal();
        }

        function sendData() {
            if (!transcriptBuffer.trim() || transcriptBuffer === "Processing...") return;
            const textToSend = transcriptBuffer;
            transcriptBuffer = "Processing...";
            updateTerminal();

            fetch(`${SCRIPT_URL}?testo=${encodeURIComponent(textToSend)}`)
                .then(res => res.json())
                .then(data => {
                    transcriptBuffer = "";
                    updateTerminal(data.text);
                    speak(data.text);
                    
                    // Mostra il report solo se il server conferma showReport: true
                    if (data.showReport === true) {
                        document.getElementById('btn-report').style.display = 'block';
                    }
                });
        }

        function getReport() {
            fetch(`${SCRIPT_URL}?testo=report`)
                .then(res => res.json())
                .then(data => {
                    updateTerminal(data.text);
                    speak(data.text);
                });
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
