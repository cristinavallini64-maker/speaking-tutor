<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --neon: #00ff41; --bg: #0a0a0a; --gray: #222; --accent: #007bff; }
    body { background: var(--bg); color: #fff; font-family: 'Roboto Mono', monospace; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { width: 90%; max-width: 450px; background: #111; border: 1px solid var(--gray); border-radius: 12px; padding: 25px; box-shadow: 0 10px 50px rgba(0,0,0,0.7); }
    
    .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #666; cursor: pointer; font-size: 0.7rem; font-weight: bold; transition: 0.2s; }
    .tab.active { color: var(--accent); border-color: var(--accent); background: rgba(0,123,255,0.05); }

    #display { min-height: 110px; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; color: #ccc; }
    .success { color: var(--neon) !important; }
    .error { color: #ff4d4d !important; }

    .mic-wrap { text-align: center; margin-bottom: 20px; }
    #mic { width: 75px; height: 75px; border-radius: 50%; border: none; background: #222; color: #fff; font-size: 1.8rem; cursor: pointer; transition: 0.3s; }
    #mic.on { background: #ff4d4d; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }

    #buffer { font-size: 0.85rem; color: #555; text-align: center; margin-bottom: 20px; min-height: 24px; font-style: italic; }

    .btn-row { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 15px; border-radius: 8px; border: none; font-family: 'Roboto Mono'; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .btn-clr { background: #222; color: #888; }
    .btn-snd { background: var(--accent); color: #fff; }

    #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #start-btn { padding: 25px 50px; font-size: 1.2rem; background: var(--neon); color: #000; border: none; font-family: 'Roboto Mono'; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="card" style="position: relative; overflow: hidden;">
  <div id="start-screen">
    <button id="start-btn" onclick="init()">INITIALIZE SYSTEM</button>
  </div>

  <div class="nav-tabs">
    <button id="t1" class="tab" onclick="setL(1)">MISSION 1</button>
    <button id="t2" class="tab" onclick="setL(2)">MISSION 2</button>
    <button id="t3" class="tab" onclick="setL(3)">MISSION 3</button>
  </div>

  <div id="display">Awaiting System Initialization...</div>

  <div class="mic-wrap">
    <button id="mic">🎤</button>
  </div>

  <div id="buffer">...</div>

  <div class="btn-row">
    <button class="btn btn-clr" onclick="clr()">Clear</button>
    <button class="btn btn-snd" onclick="snd()">Submit</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR66K5x89N_2H37bJmYpW0xN_YAnvF-Gf30HInEwLh_6GjI6mK9N3zZtXhY0L9N_Y/exec";
  const UID = "S_" + Date.now();
  let buffer = "";

  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-GB';

  function say(txt) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-GB'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function init() {
    document.getElementById('start-screen').style.display = 'none';
    setL(1);
  }

  function setL(l) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('t'+l).classList.add('active');
    document.getElementById('display').innerText = "Loading Mission...";
    
    fetch(`${SCRIPT_URL}?action=set_level&level=${l}&uid=${UID}`)
      .then(r => r.json())
      .then(d => {
        updateUI(d.text, 'new');
      });
  }

  document.getElementById('mic').onclick = () => {
    rec.start();
    document.getElementById('mic').classList.add('on');
  };

  rec.onresult = (e) => {
    buffer = (buffer + " " + e.results[0][0].transcript).trim();
    document.getElementById('buffer').innerText = buffer;
    document.getElementById('mic').classList.remove('on');
  };

  function clr() { buffer = ""; document.getElementById('buffer').innerText = "..."; }

  function snd() {
    if(!buffer) return;
    document.getElementById('display').innerText = "Analyzing transmission...";
    fetch(`${SCRIPT_URL}?testo=${encodeURIComponent(buffer)}&uid=${UID}`)
      .then(r => r.json())
      .then(d => {
        updateUI(d.text, d.status);
        buffer = ""; document.getElementById('buffer').innerText = "...";
      });
  }

  function updateUI(text, status) {
    const d = document.getElementById('display');
    d.innerText = text;
    d.className = status; // success, error, or new
    say(text);
  }
</script>
</body>
</html>
