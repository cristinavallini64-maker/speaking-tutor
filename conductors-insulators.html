<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Tutor – Conductors & Insulators</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap');
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --accent: #58a6ff; --green: #3fb950; --orange: #f0a742; --red: #f78166; --text: #e6edf3; --muted: #8b949e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  header { width: 100%; max-width: 740px; display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .badge { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent); border: 1px solid var(--accent); padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
  h1 { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; }
  .level-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 740px; margin-bottom: 20px; }
  .level-pip { height: 50px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .level-pip.active { border-color: var(--accent); color: var(--accent); }
  #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; }
  #start-btn { background: var(--green); color: #000; padding: 20px 50px; border-radius: 12px; border: none; font-size: 18px; font-weight: 700; cursor: pointer; font-family: 'Space Mono', monospace; }
  #chat-box { width: 100%; max-width: 740px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; line-height: 1.5; }
  .tutor { background: #1c2128; align-self: flex-start; border-left: 3px solid var(--accent); }
  .student { background: #0d2137; align-self: flex-end; border-right: 3px solid var(--accent); }
  #transcript-box { width: 100%; max-width: 740px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; min-height: 60px; margin-bottom: 12px; color: var(--muted); font-style: italic; }
  .controls { width: 100%; max-width: 740px; display: flex; gap: 10px; }
  .btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; text-transform: uppercase; }
  #btn-talk { background: var(--red); color: white; flex: 2; }
  #btn-send { background: var(--accent); color: #0d1117; }
  #btn-retry { background: var(--orange); color: #0d1117; display: none; } 
</style>
</head>
<body>

<div id="start-screen">
  <button id="start-btn">START SESSION</button>
</div>

<header>
  <span class="badge">Unit 1</span>
  <h1>Conductors & Insulators</h1>
</header>

<div class="level-track">
  <div class="level-pip active" id="pip-1">LV 1</div>
  <div class="level-pip" id="pip-2">LV 2</div>
  <div class="level-pip" id="pip-3">LV 3</div>
  <div class="level-pip" id="pip-4">LV 4</div>
</div>

<div id="chat-box"></div>
<div id="transcript-box">Click 'TALK' to record your answer...</div>

<div class="controls">
  <button class="btn" id="btn-talk">🎤 TALK</button>
  <button class="btn" id="btn-send" disabled>SEND ➜</button>
  <button class="btn" id="btn-retry">🔄 RETRY SEND</button>
</div>

<script>
const PROXY_URL = 'https://script.google.com/macros/s/AKfycby_f17Z1GMj1K-K62PThg1ZT4RGaNO0mwO2S1DJOu8wJvULI6NcPEm1YRviXYykUvs7/exec';

const QUESTIONS = {
  1: ["What flows through a conductor?", "Name a material that is a good conductor.", "Name a good insulator."],
  2: ["What is a conductor?", "What is an insulator?"],
  3: ["Why are metals good conductors but rubber is not?"],
  4: ["Explain the difference between conductors and insulators."]
};

let currentLevel = 1;
let currentQIndex = 0;
let recognition;
let lastTranscript = "";

function speak(text) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    lastTranscript = e.results[0][0].transcript;
    document.getElementById('transcript-box').innerText = lastTranscript;
    document.getElementById('btn-send').disabled = false;
    document.getElementById('btn-talk').style.background = 'var(--red)';
  };
}

document.getElementById('start-btn').onclick = () => {
  document.getElementById('start-screen').style.display = 'none';
  askQuestion();
};

document.getElementById('btn-talk').onclick = () => {
  recognition.start();
  document.getElementById('btn-talk').style.background = 'var(--green)';
  document.getElementById('transcript-box').innerText = "Listening...";
};

async function sendMessage() {
  if (!lastTranscript || lastTranscript === "Listening...") return;
  
  const isRetry = document.getElementById('btn-retry').style.display === 'block';
  if (!isRetry) addMessage('student', lastTranscript);
  
  const q = QUESTIONS[currentLevel][currentQIndex];
  
  document.getElementById('btn-send').style.display = 'none';
  document.getElementById('btn-retry').style.display = 'none';
  document.getElementById('transcript-box').innerText = "Connecting to Tutor...";

  try {
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      body: JSON.stringify({ prompt: `Level ${currentLevel}. Question: ${q}. Answer: ${lastTranscript}` })
    });
    const reply = await response.text();
    
    // Se la risposta è un errore di chiavi
    if (reply.includes("busy") || reply.includes("wait") || reply.includes("limit")) {
        addMessage('tutor', "System busy. Click RETRY to send again.");
        speak("System busy. Please try again.");
        document.getElementById('btn-retry').style.display = 'block';
        document.getElementById('transcript-box').innerText = "Waiting for retry...";
    } else {
        // RISPOSTA OK
        addMessage('tutor', reply);
        speak(reply);
        
        currentQIndex++;
        if (currentQIndex < QUESTIONS[currentLevel].length) {
          setTimeout(askQuestion, 2500);
        } else if (currentLevel < 4) {
          currentLevel++; currentQIndex = 0;
          addMessage('tutor', "Level Up!");
          setTimeout(askQuestion, 3000);
        } else {
          addMessage('tutor', "Well done! Practice finished.");
        }
    }
  } catch (e) {
    addMessage('tutor', "Connection error.");
    document.getElementById('btn-retry').style.display = 'block';
  }
}

document.getElementById('btn-send').onclick = sendMessage;
document.getElementById('btn-retry').onclick = sendMessage;

function askQuestion() {
  const q = QUESTIONS[currentLevel][currentQIndex];
  addMessage('tutor', q);
  speak(q);
  lastTranscript = "";
  document.getElementById('transcript-box').innerText = "Click 'TALK' to record...";
  document.getElementById('btn-send').style.display = 'block';
  document.getElementById('btn-send').disabled = true;
  document.getElementById('btn-retry').style.display = 'none';
  
  document.querySelectorAll('.level-pip').forEach(p => p.classList.remove('active'));
  document.getElementById(`pip-${currentLevel}`).classList.add('active');
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerText = text;
  const cb = document.getElementById('chat-box');
  cb.appendChild(div);
  cb.scrollTop = cb.scrollHeight;
}
</script>
</body>
</html>
