<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #22d3ee; width: 90%; max-width: 450px; text-align: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    #ov { position: absolute; inset: 0; background: #0f172a; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 18px; }
    button { cursor: pointer; font-family: 'Orbitron'; border: none; transition: 0.3s; }
    .nav { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn-l { flex: 1; padding: 12px; background: #334155; color: white; font-size: 11px; border-radius: 8px; }
    .btn-l.active { background: #22d3ee; color: #0f172a; box-shadow: 0 0 10px #22d3ee; }
    #disp { background: #0f172a; padding: 20px; border-radius: 12px; min-height: 100px; text-align: left; border-left: 5px solid #22d3ee; margin-bottom: 20px; font-size: 16px; line-height: 1.5; color: #e2e8f0; }
    #pre { color: #22d3ee; font-size: 12px; min-height: 20px; margin-bottom: 20px; font-style: italic; opacity: 0.8; }
    #mic { width: 75px; height: 75px; border-radius: 50%; background: #22d3ee; font-size: 32px; margin-bottom: 20px; margin-left: auto; margin-right: auto; display: flex; align-items: center; justify-content: center; }
    #mic.rec { background: #f43f5e; box-shadow: 0 0 20px #f43f5e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .btn-a { flex: 1; padding: 14px; font-weight: bold; color: white; border-radius: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="ov">
      <h1 style="font-family:'Orbitron'; color:#22d3ee">TECH TUTOR</h1>
      <button style="padding: 18px 40px; background: #22d3ee; border-radius:40px; color:#0f172a; font-weight: bold;" onclick="start()">INITIALIZE</button>
    </div>
    <div class="nav">
      <button id="l1" class="btn-l" onclick="setL(1)">LEVEL 1</button>
      <button id="l2" class="btn-l" onclick="setL(2)">LEVEL 2</button>
      <button id="l3" class="btn-l" onclick="setL(3)">LEVEL 3</button>
    </div>
    <div id="disp">System Online. Select a mission level.</div>
    <div id="pre">Transmission: ...</div>
    <button id="mic" onclick="tgl()">🎤</button>
    <div style="display:flex; gap:10px;">
      <button class="btn-a" style="background: #475569;" onclick="del()">🗑️ CLEAR</button>
      <button class="btn-a" style="background: #22c55e;" onclick="send()">🚀 SEND</button>
    </div>
  </div>

<script>
  const URL = "https://script.google.com/macros/s/AKfycbw0lRQBSzadKSxvew_LWzVurjslmx1dDuQwK0A9oBe7G1DI1IpieWuL_MM_G7P37G0/exec";
  let uid = localStorage.getItem('tech_uid') || "u_" + Math.random().toString(36).substr(2,5);
  localStorage.setItem('tech_uid', uid);
  
  let trans = "";
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true;

  function spk(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t); m.lang = 'en-GB'; m.rate = 0.85;
    window.speechSynthesis.speak(m);
  }

  function start() { document.getElementById('ov').style.display = 'none'; spk("Welcome Agent. Select a level."); }

  function setL(n) {
    document.querySelectorAll('.btn-l').forEach(b => b.classList.remove('active'));
    document.getElementById('l'+n).classList.add('active');
    fetch(`${URL}?action=set_level&level=${n}&uid=${uid}`).then(r => r.json()).then(d => {
      document.getElementById('disp').innerText = d.text; spk(d.text);
    });
  }

  function tgl() {
    const b = document.getElementById('mic');
    if(b.classList.contains('rec')) { rec.stop(); b.classList.remove('rec'); }
    else { rec.start(); b.classList.add('rec'); }
  }

  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) trans = (trans + " " + e.results[i][0].transcript).trim();
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('pre').innerText = "Transmission: " + trans + " " + interim;
  };

  function del() { trans = ""; document.getElementById('pre').innerText = "Transmission: ..."; }

  function send() {
    const d = document.getElementById('disp');
    // Prende il testo finale, pulendolo da prefissi inutili
    let txt = trans || document.getElementById('pre').innerText.replace("Transmission: ","");
    if(!txt || txt === "...") return;
    
    d.innerText = "Analyzing...";
    rec.stop(); document.getElementById('mic').classList.remove('rec');

    fetch(`${URL}?testo=${encodeURIComponent(txt)}&uid=${uid}`)
      .then(r => r.json())
      .then(data => {
        d.innerText = data.text; spk(data.text);
        trans = ""; document.getElementById('pre').innerText = "Transmission: ...";
      }).catch(e => { d.innerText = "Error. Try again."; });
  }
</script>
</body>
</html>
