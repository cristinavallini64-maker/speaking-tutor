<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --c: #22d3ee; --r: #f43f5e; --g: #22c55e; --b: #0f172a; }
    body { margin: 0; background: var(--b); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid var(--c); width: 90%; max-width: 400px; text-align: center; position: relative; }
    #ov { position: absolute; inset: 0; background: var(--b); z-index: 10; display: flex; justify-content: center; align-items: center; border-radius: 18px; }
    button { cursor: pointer; font-family: 'Orbitron'; border: none; transition: 0.2s; }
    .nav { display: flex; gap: 5px; margin-bottom: 15px; }
    .btn-l { flex: 1; padding: 10px; background: #334155; color: white; border-radius: 8px; font-size: 10px; }
    .btn-l.active { background: var(--c); color: var(--b); }
    #disp { background: var(--b); padding: 15px; border-radius: 10px; min-height: 80px; text-align: left; border-left: 4px solid var(--c); margin-bottom: 15px; font-size: 16px; line-height: 1.4; }
    #pre { color: var(--c); font-size: 13px; min-height: 18px; margin-bottom: 15px; font-style: italic; }
    #mic { width: 70px; height: 70px; border-radius: 50%; background: var(--c); font-size: 30px; margin-bottom: 15px; }
    #mic.rec { background: var(--r); box-shadow: 0 0 15px var(--r); }
    .foot { display: flex; gap: 10px; }
    .btn-a { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; color: white; text-transform: uppercase; font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="ov"><button style="padding: 15px 30px; border-radius: 30px; background: var(--c); color: var(--b);" onclick="start()">START MISSION</button></div>
    <div class="nav">
      <button id="l1" class="btn-l" onclick="setL(1)">LVL 1</button>
      <button id="l2" class="btn-l" onclick="setL(2)">LVL 2</button>
      <button id="l3" class="btn-l" onclick="setL(3)">LVL 3</button>
    </div>
    <div id="disp">System Online. Select a level.</div>
    <div id="pre">Transmission: ...</div>
    <button id="mic" onclick="tgl()">🎤</button>
    <div class="foot">
      <button class="btn-a" style="background: #475569;" onclick="del()">🗑️ Clear</button>
      <button class="btn-a" style="background: var(--g);" onclick="send()">🚀 Send</button>
    </div>
  </div>

<script>
  // URL GIÀ AGGIORNATO
  const URL = "https://script.google.com/macros/s/AKfycbw0lRQBSzadKSxvew_LWzVurjslmx1dDuQwK0A9oBe7G1DI1IpieWuL_MM_G7P37G0/exec";
  
  let uid = localStorage.getItem('tech_uid') || "u_" + Math.random().toString(36).substr(2,5);
  localStorage.setItem('tech_uid', uid);
  
  let trans = "";
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true;

  function spk(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t); m.lang = 'en-GB'; m.rate = 0.9;
    window.speechSynthesis.speak(m);
  }

  function start() { document.getElementById('ov').style.display = 'none'; spk("System ready, Agent."); }

  function setL(n) {
    document.querySelectorAll('.btn-l').forEach(b => b.classList.remove('active'));
    document.getElementById('l'+n).classList.add('active');
    // CORREZIONE: Parametro passato come 'level'
    fetch(`${URL}?action=set_level&level=${n}&uid=${uid}`).then(r => r.json()).then(d => {
      document.getElementById('disp').innerText = d.text; spk(d.text);
    });
  }

  function tgl() {
    const b = document.getElementById('mic');
    if(b.classList.contains('rec')) { rec.stop(); b.classList.remove('rec'); }
    else { rec.start(); b.classList.add('rec'); }
  }

  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) trans = (trans + " " + e.results[i][0].transcript).trim();
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('pre').innerText = "Transmission: " + trans + " " + interim;
  };

  function del() {
    let w = trans.split(" "); w.pop(); trans = w.join(" ");
    document.getElementById('pre').innerText = "Transmission: " + (trans || "...");
  }

  function send() {
    const d = document.getElementById('disp');
    const finalTxt = trans || document.getElementById('pre').innerText.replace("Transmission: ", "");
    if(!finalTxt || finalTxt === "...") return;
    
    d.innerText = "Analyzing...";
    rec.stop(); document.getElementById('mic').classList.remove('rec');

    fetch(`${URL}?testo=${encodeURIComponent(finalTxt)}&uid=${uid}`)
      .then(r => r.json())
      .then(data => {
        d.innerText = data.text; spk(data.text);
        trans = ""; document.getElementById('pre').innerText = "Transmission: ...";
      }).catch(e => { d.innerText = "Connection lost. Try again."; });
  }
</script>
</body>
</html>
