<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech English Tutor - Electricity</title>
    <style>
        :root {
            --lvl1: #3498db; --lvl2: #f1c40f; --lvl3: #e67e22; --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        #badge { display: inline-block; padding: 5px 15px; border-radius: 20px; color: white; font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; font-size: 0.8rem; }
        .lvl-1 { background-color: var(--lvl1); }
        .lvl-2 { background-color: var(--lvl2); color: #333 !important; }
        .lvl-3 { background-color: var(--lvl3); }
        #display-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; white-space: pre-wrap; min-height: 100px; }
        input { width: 80%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: #3498db; }
        button { padding: 12px 25px; background: #2ecc71; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #27ae60; }
        .status-wrong { color: #e74c3c; font-weight: bold; }
        .status-correct { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="badge" class="lvl-1">Level 1: Vocabulary</div>
    <div id="display-text">Caricamento missione...<br>Scrivi "reset" per iniziare.</div>
    <input type="text" id="user-input" placeholder="Scrivi la tua risposta..." onkeypress="if(event.key==='Enter') sendData()">
    <br>
    <button onclick="sendData()">Invia Risposta</button>
</div>

<script>
    // URL DEL TUO SCRIPT (VERIFICATO)
    const scriptURL = "https://script.google.com/macros/s/AKfycbwsBiVsAhgpjrZCOORKVhJnXLBiqWHYEZsGdhp3PRGAjYQTBjPIYK1mgbcf4XzObVlm/exec";

    async function sendData() {
        const inputField = document.getElementById("user-input");
        const displayText = document.getElementById("display-text");
        const badge = document.getElementById("badge");
        const val = inputField.value.trim();
        
        if (!val) return;
        
        displayText.innerHTML = "Pensando...";
        inputField.value = "";

        try {
            const response = await fetch(scriptURL, {
                method: "POST",
                mode: "no-cors", // Necessario per Google Apps Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ testo: val })
            });

            // Poiché usiamo no-cors, dobbiamo attendere un secondo e poi resettare 
            // o gestire la risposta tramite una chiamata GET di controllo se necessario.
            // TUTTAVIA, per un gioco semplice, la logica migliore è usare un bot push.
            
            // NOTA: Per leggere la risposta da Apps Script "no-cors", 
            // la soluzione più stabile è usare JSONP o cambiare l'approccio fetch.
            // Ecco la versione corretta per leggere i dati:
            
            fetch(scriptURL + "?testo=" + encodeURIComponent(val))
                .then(res => res.json())
                .then(data => {
                    displayText.innerHTML = data.text;
                    badge.innerText = "Level " + data.level + (data.level == 1 ? ": Vocabulary" : data.level == 2 ? ": Comprehension" : ": Connectors");
                    badge.className = "lvl-" + data.level;
                    
                    if(data.status === "wrong") displayText.classList.add("status-wrong");
                    else displayText.classList.remove("status-wrong");
                });

        } catch (e) {
            displayText.innerHTML = "Errore di connessione. Riprova.";
        }
    }
</script>

</body>
</html>
