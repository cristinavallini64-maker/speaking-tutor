<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor: Conductors and Insulators</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 40px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 25px; }
        #status { font-weight: bold; color: #3498db; margin-bottom: 15px; height: 20px; }
        #transcript { border: 2px dashed #bdc3c7; padding: 20px; min-height: 80px; margin: 20px 0; border-radius: 10px; background: #fafafa; font-size: 1.1rem; line-height: 1.5; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        button { padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; transition: all 0.3s ease; }
        .btn-mic { background-color: #27ae60; color: white; }
        .btn-mic:hover { background-color: #2ecc71; }
        .btn-send { background-color: #2980b9; color: white; }
        .btn-send:hover { background-color: #3498db; }
        .btn-reset { background-color: #c0392b; color: white; }
        .btn-reset:hover { background-color: #e74c3c; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Technical English Tutor</h2>
    <p>Topic: Conductors and Insulators (Levels 1-2-3)</p>
    
    <div id="status">Pronto per iniziare</div>
    <div id="transcript">Clicca sul microfono e rispondi alla domanda...</div>

    <div class="controls">
        <button class="btn-mic" id="micBtn" onclick="toggleMic()">AVVIA MICROFONO</button>
        <button class="btn-send" id="sendBtn" onclick="inviaAlTutor()">INVIA RISPOSTA</button>
        <button class="btn-reset" onclick="resetEsercizio()">CANCELLA E RIFAI</button>
    </div>
</div>

<script>
    // IL TUO URL DI GOOGLE SCRIPT (IL TUO TUBO)
    const TUBO_URL = "https://script.google.com/macros/s/AKfycby_f17Z1GMj1K-K62PThg1ZT4RGaNO0mwO2S1DJOu8wJvULI6NcPEm1YRviXYykUvs7/exec";

    let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    let isListening = false;

    recognition.onresult = (event) => {
        let currentText = event.results[event.results.length - 1][0].transcript;
        document.getElementById('transcript').innerText = currentText;
    };

    function toggleMic() {
        if (!isListening) {
            recognition.start();
            isListening = true;
            document.getElementById('micBtn').innerText = "STOP MICROFONO";
            document.getElementById('micBtn').style.backgroundColor = "#e67e22";
            document.getElementById('status').innerText = "Ti sto ascoltando... Parla in inglese.";
        } else {
            recognition.stop();
            isListening = false;
            document.getElementById('micBtn').innerText = "AVVIA MICROFONO";
            document.getElementById('micBtn').style.backgroundColor = "#27ae60";
            document.getElementById('status').innerText = "Ascolto terminato. Controlla il testo.";
        }
    }

    function resetEsercizio() {
        document.getElementById('transcript').innerText = "...";
        document.getElementById('status').innerText = "Sistema resettato. Ricominciamo dal Livello 1.";
        // Comunica il reset allo script di Google
        fetch(TUBO_URL, { method: 'POST', body: JSON.stringify({ testo: "reset" }) });
    }

    function inviaAlTutor() {
        let testoDaInviare = document.getElementById('transcript').innerText;
        if (testoDaInviare === "..." || testoDaInviare === "") return;

        document.getElementById('status').innerText = "Il Tutor sta analizzando...";
        document.getElementById('sendBtn').disabled = true;

        fetch(TUBO_URL, {
            method: 'POST',
            body: JSON.stringify({ testo: testoDaInviare })
        })
        .then(res => res.text())
        .then(risposta => {
            document.getElementById('status').innerText = "Risposta ricevuta dal Tutor.";
            document.getElementById('sendBtn').disabled = false;
            parla(risposta);
        })
        .catch(err => {
            document.getElementById('status').innerText = "Errore di connessione col server.";
            document.getElementById('sendBtn').disabled = false;
        });
    }

    function parla(testo) {
        // Sintesi vocale per far parlare il tutor
        let msg = new SpeechSynthesisUtterance(testo);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
    }
</script>

</body>
</html>
