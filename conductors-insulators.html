<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>British Speaking Tutor - High Fidelity Voice</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --bg-dark: #0a0b10;
        }
        * { user-select: none; -webkit-user-select: none; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        #terminal {
            width: 80%; max-width: 600px; height: 300px;
            border: 2px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            background: rgba(0, 0, 0, 0.9); padding: 20px; margin-bottom: 20px;
            border-radius: 10px; overflow-y: auto; font-size: 1.2rem; line-height: 1.5;
            pointer-events: none;
        }
        .user-text { color: #ff4d4d; font-style: italic; }
        .tutor-text { color: var(--neon-blue); font-weight: bold; }
        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 80%; max-width: 600px; }
        button {
            padding: 15px; font-size: 1rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; border: 2px solid var(--neon-blue); background: transparent;
            color: var(--neon-blue); transition: all 0.3s; border-radius: 5px; outline: none;
        }
        button:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 20px var(--neon-blue); }
        #btn-start { grid-column: span 2; border-color: #39ff14; color: #39ff14; }
        #btn-report { grid-column: span 2; border-color: var(--neon-pink); color: var(--neon-pink); display: none; }
        .active-rec { animation: pulse 1.5s infinite; border-color: red !important; color: red !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body onkeydown="return false;">

    <h1 style="color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue);">BRITISH VOICE FIX: ONLINE</h1>

    <div id="terminal">Initializing British Voice Engine... Ready. Keyboard disabled.</div>

    <div class="controls">
        <button id="btn-start" onclick="startMission()">🚀 Start Mission</button>
        <button id="btn-rec" onclick="toggleRec()">🎤 Rec</button>
        <button id="btn-del" onclick="deleteWord()">✖ Delete Word</button>
        <button id="btn-send" onclick="sendData()">📡 Send Data</button>
        <button id="btn-report" onclick="getReport()">📊 Get Final Report</button>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwk3gOiG-ZjkeO7q7va-Ewo_p46k9Y1jLzu8q8jHV7BvjRHrQm-6iKh1KFr8cICsAnU/exec";
        const terminal = document.getElementById('terminal');
        let recognition;
        let isRecording = false;
        let transcriptBuffer = "";
        let currentLevelCount = 0;
        let britishVoice = null;

        // --- SISTEMA VOCALE MIGLIORATO ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Cerca prima Google UK English, poi Microsoft Hazel (UK), poi qualsiasi en-GB
            britishVoice = voices.find(v => v.name === 'Google UK English Male') || 
                           voices.find(v => v.name === 'Google UK English Female') ||
                           voices.find(v => v.lang === 'en-GB') || 
                           voices.find(v => v.lang.includes('en'));
        }

        // Forza il caricamento delle voci (alcuni browser sono lenti)
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function speak(text) {
            window.speechSynthesis.cancel(); // Ferma voci precedenti
            const msg = new SpeechSynthesisUtterance(text);
            if (britishVoice) {
                msg.voice = britishVoice;
            }
            msg.lang = 'en-GB';
            msg.rate = 0.85; // Leggermente più lento per chiarezza British
            msg.pitch = 1.0;
            window.speechSynthesis.speak(msg);
        }

        // --- RICONOSCIMENTO VOCALE ---
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-GB';
            recognition.onresult = (event) => {
                const result = event.results[event.results.length - 1][0].transcript;
                transcriptBuffer += " " + result;
                updateTerminal();
            };
        }

        function updateTerminal(customTutor) {
            let tutorHTML = customTutor ? `<div class="tutor-text">${customTutor}</div>` : "";
            terminal.innerHTML = tutorHTML + `<div class="user-text">> ${transcriptBuffer}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function startMission() {
            transcriptBuffer = "";
            fetch(`${SCRIPT_URL}?testo=reset`)
                .then(res => res.json())
                .then(data => {
                    terminal.innerHTML = `<div class="tutor-text">${data.text}</div>`;
                    speak(data.text);
                });
        }

        function toggleRec() {
            const btn = document.getElementById('btn-rec');
            if (!isRecording) {
                recognition.start();
                btn.classList.add('active-rec');
                isRecording = true;
            } else {
                recognition.stop();
                btn.classList.remove('active-rec');
                isRecording = false;
            }
        }

        function deleteWord() {
            let words = transcriptBuffer.trim().split(" ");
            words.pop();
            transcriptBuffer = words.join(" ");
            updateTerminal();
        }

        function sendData() {
            if (!transcriptBuffer.trim() || transcriptBuffer === "Processing...") return;
            const tempText = transcriptBuffer;
            transcriptBuffer = "Processing...";
            updateTerminal();

            fetch(`${SCRIPT_URL}?testo=${encodeURIComponent(tempText)}`)
                .then(res => res.json())
                .then(data => {
                    transcriptBuffer = "";
                    updateTerminal(data.text);
                    speak(data.text);
                    currentLevelCount++;
                    if (currentLevelCount >= 20) {
                        document.getElementById('btn-report').style.display = 'block';
                    }
                });
        }

        function getReport() {
            fetch(`${SCRIPT_URL}?testo=report`)
                .then(res => res.json())
                .then(data => {
                    terminal.innerHTML = `<div class="tutor-text">${data.text}</div>`;
                    speak(data.text);
                });
        }
    </script>
</body>
</html>
