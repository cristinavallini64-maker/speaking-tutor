<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #22d3ee; width: 90%; max-width: 400px; text-align: center; position: relative; }
    #ov { position: absolute; inset: 0; background: #0f172a; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 18px; }
    button { cursor: pointer; font-family: 'Orbitron'; border: none; }
    .nav { display: flex; gap: 5px; margin-bottom: 15px; }
    .btn-l { flex: 1; padding: 10px; background: #334155; color: white; font-size: 10px; border-radius: 8px; }
    .btn-l.active { background: #22d3ee; color: #0f172a; }
    #disp { background: #0f172a; padding: 15px; border-radius: 10px; min-height: 80px; text-align: left; border-left: 4px solid #22d3ee; margin-bottom: 15px; font-size: 15px; }
    #mic { width: 70px; height: 70px; border-radius: 50%; background: #22d3ee; font-size: 30px; margin-bottom: 15px; }
    #mic.rec { background: #f43f5e; box-shadow: 0 0 15px #f43f5e; }
    .btn-a { flex: 1; padding: 12px; font-weight: bold; color: white; border-radius: 10px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="ov">
      <h2 style="font-family:'Orbitron'; color:#22d3ee">TECH TUTOR</h2>
      <button style="padding: 15px 30px; background: #22d3ee; border-radius:30px" onclick="start()">INITIALIZE</button>
    </div>
    <div class="nav">
      <button id="l1" class="btn-l" onclick="setL(1)">LVL 1</button>
      <button id="l2" class="btn-l" onclick="setL(2)">LVL 2</button>
      <button id="l3" class="btn-l" onclick="setL(3)">LVL 3</button>
    </div>
    <div id="disp">System standby...</div>
    <div id="pre" style="font-size: 11px; color: #22d3ee; margin-bottom: 10px; min-height: 15px;">...</div>
    <button id="mic" onclick="tgl()">🎤</button>
    <div style="display:flex; gap:10px;">
      <button class="btn-a" style="background: #475569;" onclick="del()">🗑️ CLEAR</button>
      <button class="btn-a" style="background: #22c55e;" onclick="send()">🚀 SEND</button>
    </div>
  </div>

<script>
  const URL = "https://script.google.com/macros/s/AKfycbw0lRQBSzadKSxvew_LWzVurjslmx1dDuQwK0A9oBe7G1DI1IpieWuL_MM_G7P37G0/exec";
  let uid = localStorage.getItem('tech_uid') || "u_" + Math.random().toString(36).substr(2,5);
  localStorage.setItem('tech_uid', uid);
  
  let trans = "";
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true;

  function spk(t) {
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(t); m.lang = 'en-GB'; m.rate = 0.9;
    window.speechSynthesis.speak(m);
  }

  // Forza il recupero della domanda all'avvio
  function start() { 
    document.getElementById('ov').style.display = 'none'; 
    fetch(`${URL}?action=resume&uid=${uid}`).then(r=>r.json()).then(d=>{
      document.getElementById('disp').innerText = d.text;
      spk(d.text);
    });
  }

  function setL(n) {
    document.querySelectorAll('.btn-l').forEach(b => b.classList.remove('active'));
    document.getElementById('l'+n).classList.add('active');
    fetch(`${URL}?action=set_level&level=${n}&uid=${uid}`).then(r => r.json()).then(d => {
      document.getElementById('disp').innerText = d.text; spk(d.text);
    });
  }

  function tgl() {
    const b = document.getElementById('mic');
    if(b.classList.contains('rec')) { rec.stop(); b.classList.remove('rec'); }
    else { rec.start(); b.classList.add('rec'); }
  }

  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; ++i) {
      if (e.results[i].isFinal) trans = (trans + " " + e.results[i][0].transcript).trim();
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('pre').innerText = trans + " " + interim;
  };

  function del() { trans = ""; document.getElementById('pre').innerText = "..."; }

  function send() {
    const d = document.getElementById('disp');
    const txt = trans || document.getElementById('pre').innerText;
    if(!txt || txt === "...") return;
    d.innerText = "Analyzing...";
    rec.stop(); document.getElementById('mic').classList.remove('rec');
    fetch(`${URL}?testo=${encodeURIComponent(txt)}&uid=${uid}`)
      .then(r => r.json())
      .then(data => {
        d.innerText = data.text; spk(data.text);
        trans = ""; document.getElementById('pre').innerText = "...";
      }).catch(e => { d.innerText = "Error. Try Send again."; });
  }
</script>
</body>
</html>
