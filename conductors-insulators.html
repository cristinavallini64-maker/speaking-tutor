<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Tutor – Conductors & Insulators</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f78166;
    --text: #e6edf3;
    --muted: #8b949e;
  }

  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; min-height: 100vh;
  }

  header { width: 100%; max-width: 600px; margin-bottom: 20px; text-align: center; }
  h1 { font-family: 'Space Mono', monospace; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

  /* Progress Tracker */
  .level-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 600px; margin-bottom: 20px; }
  .level-pip {
    padding: 10px; border-radius: 8px; border: 2px solid var(--border);
    background: var(--surface); text-align: center; cursor: pointer; transition: 0.2s;
  }
  .level-pip.active { border-color: var(--accent); color: var(--accent); }
  .level-pip.done { border-color: var(--green); color: var(--green); }
  .level-pip.locked { opacity: 0.4; cursor: not-allowed; }
  .pip-num { display: block; font-weight: bold; font-family: 'Space Mono'; }
  .pip-name { font-size: 10px; text-transform: uppercase; }

  /* Chat Box */
  #chat-box {
    width: 100%; max-width: 600px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    height: 300px; overflow-y: auto; padding: 15px; margin-bottom: 15px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; }
  .tutor { background: #1c2128; align-self: flex-start; border-left: 3px solid var(--accent); }
  .student { background: #0d2137; align-self: flex-end; border-right: 3px solid var(--accent); }

  /* Controls */
  .controls { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
  #transcript-preview { 
    background: var(--bg); border: 1px dashed var(--muted); 
    padding: 10px; border-radius: 8px; min-height: 40px; font-style: italic; color: var(--muted);
  }
  .btn-group { display: flex; gap: 10px; }
  .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
  #btn-talk { background: var(--red); color: white; }
  #btn-send { background: var(--accent); color: #000; }
  #btn-send:disabled { opacity: 0.3; }

  .status-msg { font-size: 12px; color: var(--muted); font-family: 'Space Mono'; margin-top: 5px; }
</style>
</head>
<body>

<header>
  <h1>Conductors & Insulators Speaking Tutor</h1>
  <div id="status" class="status-msg">Ready to start Level 1</div>
</header>

<div class="level-track">
  <div class="level-pip active" id="pip-1">
    <span class="pip-num">1</span><span class="pip-name">Keywords</span>
  </div>
  <div class="level-pip locked" id="pip-2">
    <span class="pip-num">2</span><span class="pip-name">Sentence</span>
  </div>
  <div class="level-pip locked" id="pip-3">
    <span class="pip-num">3</span><span class="pip-name">Double Step</span>
  </div>
  <div class="level-pip locked" id="pip-4">
    <span class="pip-num">4</span><span class="pip-name">Paragraph</span>
  </div>
</div>

<div id="chat-box">
  <div class="msg tutor">Hello! I am your AI Tutor. Let's start with Level 1 (Keywords). Press the button and answer in 1 or 2 words.</div>
</div>

<div class="controls">
  <div id="transcript-preview">Your speech will appear here...</div>
  <div class="btn-group">
    <button class="btn" id="btn-talk">🎤 HOLD TO SPEAK</button>
    <button class="btn" id="btn-send" disabled>SEND ANSWER ➜</button>
  </div>
  <button onclick="location.reload()" style="background:none; border:none; color:var(--muted); font-size:10px; cursor:pointer;">↺ Reset Session</button>
</div>

<script>
// URL recuperato dal tuo screenshot
const PROXY_URL = 'https://script.google.com/macros/s/AKfycby_f17Z1GMj1K-K62PThg1ZT4RGaNO0mwO2S1DJOu8wJvULI6NcPEm1YRviXYykUvs7/exec';

const QUESTIONS = {
  1: ["What flows through a conductor?", "Name a material that is a good conductor.", "What particles move freely inside conductors?", "Name a good insulator.", "What do insulators resist?", "Why are electrical cables covered with rubber or plastic?", "What is produced when electrons collide with atoms?", "What word describes a material's opposition to current?", "Which metal is most used in electric wires?"],
  2: ["What is electric current?", "What is a conductor?", "Why are metals good conductors?", "What is an insulator?", "Why are electrical cables covered with insulating material?", "What is resistance?", "What happens when electrons collide with atoms?"],
  3: ["Why are metals good conductors but rubber is not?", "Why are cables covered with rubber and why is it important?", "What is the relationship between resistance and heat?", "Why do insulators keep electric charge in place?", "How are free electrons related to electric current?", "What happens to resistance when electrons collide with atoms?"],
  4: ["Explain conductors and insulators with examples.", "Explain why metals are good conductors (mention free electrons).", "Explain what resistance is and its effects.", "Explain cable construction and safety.", "Explain the difference between conductor and insulator resistance."]
};

let currentLevel = 1;
let currentQIndex = 0;
let recognition;
let isSpeaking = false;

// Inizializzazione Riconoscimento Vocale
if ('webkitSpeechRecognition' in window) {
  recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    let transcript = event.results[0][0].transcript;
    document.getElementById('transcript-preview').innerText = transcript;
    document.getElementById('btn-send').disabled = false;
  };

  recognition.onend = () => {
    document.getElementById('btn-talk').style.background = 'var(--red)';
    document.getElementById('btn-talk').innerText = '🎤 HOLD TO SPEAK';
  };
}

document.getElementById('btn-talk').addEventListener('mousedown', () => {
  recognition.start();
  document.getElementById('btn-talk').style.background = 'var(--green)';
  document.getElementById('btn-talk').innerText = 'Listening...';
});

document.getElementById('btn-talk').addEventListener('mouseup', () => {
  recognition.stop();
});

// Funzione Invia Messaggio
async function sendMessage() {
  const transcript = document.getElementById('transcript-preview').innerText;
  const chatBox = document.getElementById('chat-box');
  const sendBtn = document.getElementById('btn-send');
  
  if (!transcript || transcript === "Your speech will appear here...") return;

  // Mostra messaggio studente
  const studentMsg = document.createElement('div');
  studentMsg.className = 'msg student';
  studentMsg.innerText = transcript;
  chatBox.appendChild(studentMsg);
  chatBox.scrollTop = chatBox.scrollHeight;

  sendBtn.disabled = true;
  document.getElementById('status').innerText = "Tutor is thinking...";

  const currentQ = QUESTIONS[currentLevel][currentQIndex];
  const fullPrompt = `Level: ${currentLevel}. Question: ${currentQ}. Student Answer: ${transcript}. Provide brief feedback and confirm if correct.`;

  try {
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      body: JSON.stringify({ prompt: fullPrompt })
    });
    const reply = await response.text();

    const tutorMsg = document.createElement('div');
    tutorMsg.className = 'msg tutor';
    tutorMsg.innerText = reply;
    chatBox.appendChild(tutorMsg);
    chatBox.scrollTop = chatBox.scrollHeight;

    // Avanzamento domande
    currentQIndex++;
    if (currentQIndex >= QUESTIONS[currentLevel].length) {
      completeLevel();
    } else {
      setTimeout(() => {
        const nextQ = document.createElement('div');
        nextQ.className = 'msg tutor';
        nextQ.innerHTML = `<b>Next Question:</b> ${QUESTIONS[currentLevel][currentQIndex]}`;
        chatBox.appendChild(nextQ);
        chatBox.scrollTop = chatBox.scrollHeight;
        document.getElementById('status').innerText = `Level ${currentLevel}: Q${currentQIndex+1}/${QUESTIONS[currentLevel].length}`;
      }, 1000);
    }
  } catch (e) {
    alert("Connection error. Check your Google Script URL.");
  }

  document.getElementById('transcript-preview').innerText = "Your speech will appear here...";
  document.getElementById('status').innerText = `Level ${currentLevel}: Q${currentQIndex+1}/${QUESTIONS[currentLevel].length}`;
}

function completeLevel() {
  document.getElementById(`pip-${currentLevel}`).classList.remove('active');
  document.getElementById(`pip-${currentLevel}`).classList.add('done');
  
  if (currentLevel < 4) {
    currentLevel++;
    currentQIndex = 0;
    document.getElementById(`pip-${currentLevel}`).classList.remove('locked');
    document.getElementById(`pip-${currentLevel}`).classList.add('active');
    
    const winMsg = document.createElement('div');
    winMsg.className = 'msg tutor';
    winMsg.style.borderColor = 'var(--green)';
    winMsg.innerText = `LEVEL ${currentLevel-1} COMPLETE! Click on the next level above to start Level ${currentLevel}.`;
    document.getElementById('chat-box').appendChild(winMsg);
  } else {
    document.getElementById('status').innerText = "CONGRATULATIONS! You finished all levels.";
  }
}

document.getElementById('btn-send').addEventListener('click', sendMessage);

// Prima domanda automatica
window.onload = () => {
  const firstQ = document.createElement('div');
  firstQ.className = 'msg tutor';
  firstQ.innerHTML = `<b>Q1:</b> ${QUESTIONS[1][0]}`;
  document.getElementById('chat-box').appendChild(firstQ);
  document.getElementById('status').innerText = `Level 1: Q1/${QUESTIONS[1].length}`;
};
</script>
</body>
</html>
