<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Electrical English Tutor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        #display-text { font-size: 1.2rem; margin: 20px 0; min-height: 100px; color: #2c3e50; white-space: pre-wrap; line-height: 1.5; }
        #user-echo { font-style: italic; color: #95a5a6; margin-bottom: 15px; min-height: 1.2rem; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 1rem; }
        .btn-send { background: #27ae60; color: white; flex-grow: 1; }
        .btn-mic { background: #3498db; color: white; flex-grow: 1; }
        .btn-reset { background: transparent; color: #e74c3c; font-size: 0.8rem; text-decoration: underline; border: none; cursor: pointer; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        .status-wrong { color: #e74c3c; }
    </style>
</head>
<body>

<div class="card">
    <div id="display-text">Type "reset" to start the mission.</div>
    <div id="user-echo"></div>
    
    <input type="text" id="user-input" placeholder="Type or click Speak...">
    
    <div class="controls">
        <button class="btn-send" onclick="processInput()">SEND</button>
        <button class="btn-mic" id="mic-btn">🎤 SPEAK</button>
    </div>

    <button class="btn-reset" onclick="resetGame()">Reset Progress</button>
</div>

<script>
    // IL TUO LINK AGGIORNATO
    const scriptURL = "https://script.google.com/macros/s/AKfycbzqN5conrnr6mI1vzlts_dPIde3LMuNc6jjLvYaqasFWsnpFYtkHrMzgb7wkgPj7zSl/exec";
    
    const inputField = document.getElementById("user-input");
    const displayText = document.getElementById("display-text");
    const userEcho = document.getElementById("user-echo");

    async function processInput(forcedValue = null) {
        const val = forcedValue || inputField.value.trim();
        if(!val) return;
        
        userEcho.innerText = "You said: " + val;
        displayText.innerText = "Checking...";
        inputField.value = ""; 

        try {
            const res = await fetch(scriptURL + "?testo=" + encodeURIComponent(val));
            const data = await res.json();
            
            // Gestione della risposta
            displayText.innerText = data.text;
            
            // Feedback visuale se sbagliato
            if(data.text.includes("❌")) {
                displayText.style.color = "#e74c3c";
            } else {
                displayText.style.color = "#2c3e50";
            }
        } catch(e) {
            displayText.innerText = "Connection error. Please try again.";
        }
    }

    function resetGame() {
        if(confirm("Do you want to restart from Level 1?")) {
            processInput("reset");
        }
    }

    // Speech Recognition Setup
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processInput(transcript); 
    };

    document.getElementById("mic-btn").onclick = () => {
        recognition.start();
        displayText.innerText = "Listening...";
    };

    inputField.onkeypress = (e) => { if(e.key === 'Enter') processInput(); };
</script>
</body>
</html>
