<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { width: 90%; max-width: 400px; background: #1e293b; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .nav { display: flex; gap: 5px; margin-bottom: 20px; }
    .nav button { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #334155; color: #94a3b8; cursor: pointer; font-weight: bold; }
    .nav button.active { background: #3b82f6; color: white; }
    #msg { min-height: 100px; font-size: 1.2rem; margin-bottom: 20px; line-height: 1.4; color: #f1f5f9; }
    .mic { width: 80px; height: 80px; border-radius: 50%; border: none; background: #3b82f6; color: white; font-size: 2rem; cursor: pointer; margin-bottom: 10px; }
    .mic.on { background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    #buffer { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; min-height: 1.2rem; }
    .actions { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    .clr { background: #475569; color: white; }
    .snd { background: #10b981; color: white; }
    #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 10; display: flex; align-items: center; justify-content: center; border-radius: 15px; }
    #start-overlay button { padding: 20px 40px; font-size: 1.5rem; border-radius: 50px; border: none; background: #10b981; color: white; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="card" style="position: relative;">
  <div id="start-overlay"><button onclick="startApp()">START MISSION</button></div>
  
  <div class="nav">
    <button id="l1" onclick="load(1)">LVL 1</button>
    <button id="l2" onclick="load(2)">LVL 2</button>
    <button id="l3" onclick="load(3)">LVL 3</button>
  </div>
  <div id="msg">Initializing...</div>
  <button id="mic" class="mic" onclick="listen()">🎤</button>
  <div id="buffer">...</div>
  <div class="actions">
    <button class="btn clr" onclick="reset()">Clear</button>
    <button class="btn snd" onclick="send()">Submit</button>
  </div>
</div>

<script>
  const URL = "https://script.google.com/macros/s/AKfycbyR66K5x89N_2H37bJmYpW0xN_YAnvF-Gf30HInEwLh_6GjI6mK9N3zZtXhY0L9N_Y/exec";
  const UID = "USER_" + Date.now();
  let transcript = "";

  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'en-GB';

  function say(t) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'en-GB'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function startApp() {
    document.getElementById('start-overlay').style.display = 'none';
    load(1);
  }

  function load(lvl) {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('l'+lvl).classList.add('active');
    document.getElementById('msg').innerText = "Loading...";
    fetch(`${URL}?action=set_level&level=${lvl}&uid=${UID}`)
      .then(r => r.json()).then(d => {
        document.getElementById('msg').innerText = d.text;
        say(d.text);
      });
  }

  function listen() {
    rec.start(); document.getElementById('mic').classList.add('on');
  }

  rec.onresult = (e) => {
    transcript = (transcript + " " + e.results[0][0].transcript).trim();
    document.getElementById('buffer').innerText = transcript;
    document.getElementById('mic').classList.remove('on');
  };

  function reset() { transcript = ""; document.getElementById('buffer').innerText = "..."; }

  function send() {
    if(!transcript) return;
    document.getElementById('msg').innerText = "Analyzing...";
    fetch(`${URL}?testo=${encodeURIComponent(transcript)}&uid=${UID}`)
      .then(r => r.json()).then(d => {
        document.getElementById('msg').innerText = d.text;
        say(d.text);
        reset();
      });
  }
</script>

</body>
</html>
