<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
    .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    .btn-lvl { background: #555; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 10px; cursor: pointer; font-size: 14px; }
    .btn-lvl:hover { background: #333; }
    .btn-mic { background: #007bff; color: white; width: 100px; height: 100px; border-radius: 50%; font-size: 40px; border: none; margin: 25px 0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,123,255,0.3); }
    #response { margin-top: 20px; font-weight: bold; min-height: 80px; border-top: 1px solid #eee; padding-top: 15px; white-space: pre-line; }
    #status { color: #888; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <h3>⚡ Tech Quiz Selector</h3>
  
  <div style="margin-bottom: 15px;">
    <button class="btn-lvl" onclick="setLevel(1)">Level 1</button>
    <button class="btn-lvl" onclick="setLevel(2)">Level 2</button>
    <button class="btn-lvl" onclick="setLevel(3)">Level 3</button>
  </div>

  <div id="status">Click a level to start</div>
  <button id="micBtn" class="btn-mic">🎤</button>
  
  <div id="response">Choose your mission!</div>
</div>

<script>
  // SOSTITUISCI CON IL TUO URL
  const SCRIPT_URL = "https://script.google.com/macros/s/INSERISCI_QUI_URL/exec";
  const userUID = "std_" + Math.random().toString(36).substr(2, 5);

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'en-US';

  // FUNZIONE PER I BOTTONI
  function setLevel(lvl) {
    document.getElementById('status').innerText = "Starting Level " + lvl + "...";
    fetch(`${SCRIPT_URL}?action=set_level&level=${lvl}&uid=${userUID}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('response').innerText = data.text;
        document.getElementById('status').innerText = "Listening for answers...";
      });
  }

  // FUNZIONE PER IL MICROFONO
  micBtn.onclick = () => {
    recognition.start();
    document.getElementById('status').innerText = "Listening...";
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById('status').innerText = "Processing...";
    fetch(`${SCRIPT_URL}?testo=${encodeURIComponent(text)}&uid=${userUID}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('response').innerText = data.text;
        document.getElementById('status').innerText = "Ready";
      });
  };
</script>

</body>
</html>
